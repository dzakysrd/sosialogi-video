<!doctype html>
<!-- GENERATED by tools/build.mjs from scenes.json. Do not hand-edit: change scenes.json, then run `npm run build`. -->
<html lang="id" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Sosialogi video template</title>
    <style>
{{STYLE}}
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="{{TOTAL}}"
      data-width="1080"
      data-height="1920"
      data-fps="{{FPS}}"
    >
{{SCENES}}
{{OVERLAYS}}
{{AUDIO}}
    </div>

    <!-- Inline map: one <path> per province, id = ISO-style id, data-name = display name. -->
    <template id="map-svg">
{{MAP_SVG}}
    </template>

    <!-- Config = scenes.json with computed start times. Read by components/sos.js. -->
    <script type="application/json" id="scenes-config">{{CONFIG_JSON}}</script>

    <script src="vendor/gsap.min.js"></script>
    <script src="components/sos.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var cfg = JSON.parse(document.getElementById("scenes-config").textContent);
        window.__timelines["main"] = window.SOS.build(cfg);
        window.__timelines["main"].seek(0);
      })();
    </script>
  </body>
</html>
